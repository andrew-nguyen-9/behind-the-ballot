# Post-deploy canary [v1.10.2] + regression alerts [v1.10.3] — pings the LIVE Cloudflare preview
# and, on any regression (a route not 200 or a missing security header), opens/updates a DEDUPED
# GitHub issue AND emails the maintainer with a summary + diff + run link + severity [S9c,S10a,S11a],
# then still fails the job (→ GitHub's native email as a backstop). Runs shortly after the nightly
# refresh redeploys, and on demand. Read-only on the repo; never touches `main` [S5a].
name: canary

on:
  schedule:
    - cron: "40 9 * * *" # ~20m after refresh (09:17) — lets Workers Build redeploy first
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # regression alerter opens/comments the deduped regression issue [S11a]

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --project pipeline

      - id: canary
        run: node scripts/canary.mjs # writes canary-report.json (checks[]) + exits non-zero on fail
        continue-on-error: true # capture the outcome so we can alert before failing the job

      - name: regression alert (issue + email) on failure
        if: steps.canary.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: uv run --project pipeline python -m btb_pipeline.regression --report canary-report.json

      - name: fail the job if the canary regressed
        if: steps.canary.outcome == 'failure'
        run: exit 1
